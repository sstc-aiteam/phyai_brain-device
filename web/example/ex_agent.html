<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Robot AI Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #f2f4f7;
            color: #1f2937;
            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;
        }

        .agent-container {
            width: 100%;
            max-width: 900px;
            height: 720px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #d9dee7;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .agent-header {
            padding: 18px 22px;
            border-bottom: 1px solid #e5e7eb;
            background: #111827;
            color: #ffffff;
        }

        .agent-title {
            margin: 0;
            font-size: 20px;
        }

        .agent-subtitle {
            margin: 6px 0 0;
            color: #cbd5e1;
            font-size: 13px;
        }

        .conversation {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
            background: #f8fafc;
        }

        .message-row {
            display: flex;
            margin-bottom: 16px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.AI {
            justify-content: flex-start;
        }

        .message {
            max-width: 78%;
            padding: 12px 14px;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-row.user .message {
            background: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 3px;
        }

        .message-row.AI .message {
            background: #ffffff;
            color: #1f2937;
            border: 1px solid #d9dee7;
            border-bottom-left-radius: 3px;
        }

        .message.error {
            border-color: #ef4444;
            background: #fff1f2;
            color: #991b1b;
        }

        .tool-result {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            background: #f3f4f6;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .input-panel {
            padding: 18px;
            border-top: 1px solid #e5e7eb;
            background: #ffffff;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #messageInput {
            flex: 1;
            min-height: 54px;
            max-height: 160px;
            resize: vertical;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            line-height: 1.5;
        }

        #messageInput:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        #sendButton {
            min-width: 100px;
            height: 54px;
            padding: 0 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        #sendButton:hover {
            background: #1d4ed8;
        }

        #sendButton:disabled {
            cursor: not-allowed;
            background: #94a3b8;
        }

        .status-text {
            min-height: 20px;
            margin-top: 8px;
            color: #64748b;
            font-size: 13px;
        }

        .hint {
            margin-bottom: 14px;
            padding: 10px 12px;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 14px;
        }

        @media (max-width: 640px) {
            body {
                padding: 0;
            }

            .agent-container {
                height: 100vh;
                border: none;
                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }

            .input-row {
                flex-direction: column;
                align-items: stretch;
            }

            #sendButton {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="agent-container">
        <header class="agent-header">
            <h1 class="agent-title">Robot AI Agent</h1>

            <p class="agent-subtitle">
                輸入自然語言，AI 將選擇適合的機器人 API。
            </p>
        </header>

        <section id="conversation" class="conversation" aria-live="polite">
            <div class="hint">
                目前此介面只解析指令並顯示 API function，
                不會直接執行機器人動作。
            </div>

        </section>

        <section class="input-panel">
            <div class="input-row">
                <textarea id="messageInput" placeholder="「幫我把夾爪張開」 或「手臂往上移動 2 公分」..." aria-label="輸入機器人指令"></textarea>
                <button id="sendButton" type="button">發送</button>
            </div>

            <div id="statusText" class="status-text"></div>
        </section>
    </main>

    <script type="module" src="/web/includes/library/JSFile/robotjs2026.js"></script>

    <script>
        const conversationElement = document.getElementById("conversation");
        const messageInputElement = document.getElementById("messageInput");
        const sendButtonElement = document.getElementById("sendButton");
        const statusTextElement = document.getElementById("statusText");

        function setSendingState(isSending)
        {
            sendButtonElement.disabled = isSending;
            messageInputElement.disabled = isSending;
            statusTextElement.textContent = isSending
                ? "正在等待 AI 回應..."
                : "";
        }

        async function renderAIResponse(response)
        {
            const data = response?.data ?? {};
            const selected = response?.result === true;

            const answer =
                data.answer ||
                response?.message ||
                response?.error ||
                "AI 無法回應";

            const message = await updateStreamMessage(
                "conversation",
                "AI",
                `回應：${answer}`,
                { speed: 25 }
            );

            if (selected && data.function_name)
            {
                const toolResult = document.createElement("div");
                toolResult.className = "tool-result";

                toolResult.textContent = [
                    `模組：${data.module ?? "-"}`,
                    `API 函數：${data.function_name}`,
                    `參數：${JSON.stringify(data.arguments ?? {}, null, 2)}`,
                    `原因：${data.reason ?? "-"}`
                ].join("");

                message.appendChild(toolResult);
            }

            const missingParameters = Array.isArray(data.missing_parameters)
                ? data.missing_parameters
                : [];

            if (!selected && missingParameters.length > 0)
            {
                const missingResult = document.createElement("div");
                missingResult.className = "tool-result";
                missingResult.textContent =
                    `缺少參數：${missingParameters.join("、")}`;

                message.appendChild(missingResult);
            }

            scrollToBottom("conversation");
        }

        async function handleSendAI()
        {
            const text = messageInputElement.value.trim();

            if (!text)
            {
                statusTextElement.textContent = "請先輸入指令。";
                messageInputElement.focus();
                return;
            }

            updateMessage("conversation", "user", text);
            messageInputElement.value = "";
            setSendingState(true);

            try
            {
                const response = await sendAI(text);
                await renderAIResponse(response);
            }
            catch (error)
            {
                await updateStreamMessage(
                    "conversation",
                    "AI",
                    `Agent API 請求失敗：${error.message}`,
                    {
                        error: true,
                        speed: 25
                    }
                );
            }
            finally
            {
                setSendingState(false);
                messageInputElement.focus();
            }
        }

        sendButtonElement.addEventListener("click", () => {
            void handleSendAI();
        });

        messageInputElement.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey)
            {
                event.preventDefault();
                void handleSendAI();
            }
        });

        messageInputElement.focus();
    </script>

</body>
</html>
