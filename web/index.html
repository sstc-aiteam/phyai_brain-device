<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Robot Brain</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                "Noto Sans TC",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            margin:
                0
                0
                24px;

            text-align: center;

            font-size: 28px;
        }

        .module-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 14px;
        }

        .module-button {
            width: 100%;

            min-height: 90px;

            border:
                1px solid #ccc;

            border-radius: 10px;

            background: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        .module-button:hover {
            background: #eeeeee;
        }

        .module-button:active {
            transform: scale(0.98);
        }

        .module-button.disabled {
            color: #999;

            background: #eeeeee;

            cursor: default;
        }

        @media (
            max-width: 600px
        ) {
            .module-grid {
                grid-template-columns:
                    1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        Robot Brain
    </h1>

    <div class="module-grid">

        <button class="module-button" onclick="window.location.href='/perception'">1. Perception</button>
        <button class="module-button" onclick="window.location.href='/worldmodel'">2. World Model</button>
        <button class="module-button disabled" type="button">3. Plan</button>
        <button class="module-button" onclick="window.location.href='/action'">4. Action</button>
        <button class="module-button disabled" type="button">5. Agent</button>
        <button class="module-button disabled" type="button">6. Calibration</button>
        <button class="module-button disabled" type="button">7. Training</button>

    </div>

</div>

</body>
</html>
